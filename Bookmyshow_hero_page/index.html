<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title style="font-weight: bold;">Creation</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./favicon.jpg">
</head>
<body>
    <header>
        <div class="head">
            <div class="logo">
                <div class="left">
                    <h1>BookMyShow</h1>
                </div>

                <div class="right">
                    <button>Movies</button>
                    <button>Events</button>
                    <button>Sports</button>
                    <button>More</button>

                </div>

            </div>

            <div class="search">
                <div class="searching">
                    <input type="text" placeholder="search for movies or sports">
                </div>
                <div>
                    <button class="search_button">search</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="hero">
            <img src="./hero.png" alt="hero image">
        </div>

        <div class="popular">
            <h2>Popular Movies</h2>
        </div>

        <div class="movie">
            <div class="card">
                <img src="./bhootvbangla.webp" alt="img1" class="images">
                <h3>Bhooth Bangla</h3>
            </div>

            <div class="card">
                <img src="./dacoit.webp" alt="img2" class="images">
                <h3>Dacoit</h3>
            </div>

            <div class="card">
                <img src="./dhurandhar.webp" alt="img3" class="images">
                <h3>Dhurandhar</h3>
            </div>

            <div class="card">
                <img src="./ek din.webp" alt="img4" class="images">
                <h3>Ek din</h3>
            </div>
            
            <div class="card">
                <img src="./michael.webp" alt="img5" class="images">
                <h3>Michael</h3>
            </div>

            <div class="card">
                <img src="./mayan.webp" alt="img6" class="images">
                <h3>Mayan</h3>
            </div>

            <div class="card">
                <img src="./ginny.webp" alt="img7" class="images">
                <h3>Ginny weds Sunny 2</h3>
            </div>

            <div class="card">
                <img src="./themummy.webp" alt="img8" class="images">
                <h3>The Mummy</h3>
            </div>
        </div>






    </main>
    
</body>
</html>
